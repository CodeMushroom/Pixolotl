<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Copyright 2026 CodeMushroom. SPDX-License-Identifier: Apache-2.0.
       The Pixolotl name and this logo are CodeMushroom trademarks (TRADEMARKS.md).
       Gitolotl's axolotl as a golden axolotl on indigo, with a pen nib. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2d86"/>
      <stop offset="1" stop-color="#171236"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe7a3"/>
      <stop offset="1" stop-color="#ffc24a"/>
    </linearGradient>
    <linearGradient id="nib" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ff3e6"/>
      <stop offset="1" stop-color="#2fc4b6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- bubbles -->
  <circle cx="92" cy="96" r="12" fill="none" stroke="#5a4cb0" stroke-width="5"/>
  <circle cx="126" cy="62" r="7" fill="none" stroke="#5a4cb0" stroke-width="4"/>
  <circle cx="420" cy="86" r="9" fill="none" stroke="#5a4cb0" stroke-width="4"/>
  <!-- gills, left -->
  <g transform="translate(138 250)" fill="none" stroke-linecap="round">
    <g transform="rotate(34)">
      <path d="M0 0 C -30 -14 -76 -22 -128 -18" stroke="#ec5a2a" stroke-width="30"/>
      <path d="M-40 -14 l-10 -24 M-72 -19 l-8 -26 M-104 -20 l-4 -26 M-44 -10 l-6 24 M-78 -14 l-4 26 M-108 -16 l0 26" stroke="#ec5a2a" stroke-width="13"/>
      <path d="M-8 -3 C -36 -13 -76 -19 -122 -17" stroke="#ff9a5c" stroke-width="10"/>
    </g>
    <g transform="rotate(4)">
      <path d="M0 0 C -30 -14 -76 -22 -128 -18" stroke="#ec5a2a" stroke-width="30"/>
      <path d="M-40 -14 l-10 -24 M-72 -19 l-8 -26 M-104 -20 l-4 -26 M-44 -10 l-6 24 M-78 -14 l-4 26 M-108 -16 l0 26" stroke="#ec5a2a" stroke-width="13"/>
      <path d="M-8 -3 C -36 -13 -76 -19 -122 -17" stroke="#ff9a5c" stroke-width="10"/>
    </g>
    <g transform="rotate(-28)">
      <path d="M0 0 C -30 -14 -76 -22 -128 -18" stroke="#ec5a2a" stroke-width="30"/>
      <path d="M-40 -14 l-10 -24 M-72 -19 l-8 -26 M-104 -20 l-4 -26 M-44 -10 l-6 24 M-78 -14 l-4 26 M-108 -16 l0 26" stroke="#ec5a2a" stroke-width="13"/>
      <path d="M-8 -3 C -36 -13 -76 -19 -122 -17" stroke="#ff9a5c" stroke-width="10"/>
    </g>
  </g>
  <!-- gills, right -->
  <g transform="translate(374 250) scale(-1 1)" fill="none" stroke-linecap="round">
    <g transform="rotate(34)">
      <path d="M0 0 C -30 -14 -76 -22 -128 -18" stroke="#ec5a2a" stroke-width="30"/>
      <path d="M-40 -14 l-10 -24 M-72 -19 l-8 -26 M-104 -20 l-4 -26 M-44 -10 l-6 24 M-78 -14 l-4 26 M-108 -16 l0 26" stroke="#ec5a2a" stroke-width="13"/>
      <path d="M-8 -3 C -36 -13 -76 -19 -122 -17" stroke="#ff9a5c" stroke-width="10"/>
    </g>
    <g transform="rotate(4)">
      <path d="M0 0 C -30 -14 -76 -22 -128 -18" stroke="#ec5a2a" stroke-width="30"/>
      <path d="M-40 -14 l-10 -24 M-72 -19 l-8 -26 M-104 -20 l-4 -26 M-44 -10 l-6 24 M-78 -14 l-4 26 M-108 -16 l0 26" stroke="#ec5a2a" stroke-width="13"/>
      <path d="M-8 -3 C -36 -13 -76 -19 -122 -17" stroke="#ff9a5c" stroke-width="10"/>
    </g>
    <g transform="rotate(-28)">
      <path d="M0 0 C -30 -14 -76 -22 -128 -18" stroke="#ec5a2a" stroke-width="30"/>
      <path d="M-40 -14 l-10 -24 M-72 -19 l-8 -26 M-104 -20 l-4 -26 M-44 -10 l-6 24 M-78 -14 l-4 26 M-108 -16 l0 26" stroke="#ec5a2a" stroke-width="13"/>
      <path d="M-8 -3 C -36 -13 -76 -19 -122 -17" stroke="#ff9a5c" stroke-width="10"/>
    </g>
  </g>
  <!-- head -->
  <ellipse cx="256" cy="286" rx="162" ry="128" fill="url(#skin)"/>
  <ellipse cx="256" cy="232" rx="110" ry="46" fill="#fff6d8" opacity=".55"/>
  <!-- freckle: a curve with its two anchors and a handle -->
  <path d="M222 236 C 232 196 262 226 286 196" fill="none" stroke="#e0901c" stroke-width="7" stroke-linecap="round"/>
  <path d="M286 196 L 300 178" fill="none" stroke="#e0901c" stroke-width="4" stroke-linecap="round"/>
  <rect x="214" y="228" width="16" height="16" fill="#e0901c"/>
  <rect x="278" y="188" width="16" height="16" fill="#e0901c"/>
  <circle cx="302" cy="176" r="6" fill="#e0901c"/>
  <!-- cheeks -->
  <ellipse cx="150" cy="322" rx="30" ry="18" fill="#ff8f5a" opacity=".7"/>
  <ellipse cx="362" cy="322" rx="30" ry="18" fill="#ff8f5a" opacity=".7"/>
  <!-- eyes -->
  <circle cx="170" cy="282" r="23" fill="#2a1a14"/>
  <circle cx="342" cy="282" r="23" fill="#2a1a14"/>
  <circle cx="178" cy="273" r="8" fill="#fff"/>
  <circle cx="350" cy="273" r="8" fill="#fff"/>
  <circle cx="163" cy="291" r="4" fill="#fff" opacity=".8"/>
  <circle cx="335" cy="291" r="4" fill="#fff" opacity=".8"/>
  <!-- smile -->
  <path d="M200 318 Q256 362 312 318" fill="none" stroke="#2a1a14" stroke-width="9" stroke-linecap="round"/>
  <!-- pen nib, tip down and to the left, with the line it has drawn -->
  <path d="M352 462 C 300 482 248 452 196 470" fill="none" stroke="#2fc4b6" stroke-width="10" stroke-linecap="round"/>
  <g transform="translate(414 392) rotate(38)">
    <path d="M0 96 L-44 -6 Q-48 -28 -32 -44 L32 -44 Q48 -28 44 -6 Z" fill="url(#nib)" stroke="#123c48" stroke-width="8" stroke-linejoin="round"/>
    <path d="M0 90 L0 4" stroke="#123c48" stroke-width="7" stroke-linecap="round"/>
    <circle cx="0" cy="-2" r="10" fill="#123c48"/>
    <rect x="-36" y="-76" width="72" height="30" rx="8" fill="#123c48"/>
  </g>
</svg>
